server:
  port: 8080

spring:
  application:
    name: polyface-backend
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 500MB      # FR-51 音视频入料上限
      max-request-size: 520MB

polyface:
  llm:
    base-url: http://127.0.0.1:8000   # Python LLM 服务
    # 调用超时预算（显式，不是魔法数字）：
    # 生成属长任务，上游限流时单平台实测可达 250s，故默认 240s 且**默认单平台**；
    # 若单平台仍常超时，应评估轻量异步方案，而不是无限延长超时。
    timeout-sec: ${POLYFACE_LLM_TIMEOUT_SEC:240}
    # 短任务（解析/学习/用量查询等）预算
    fast-timeout-sec: ${POLYFACE_LLM_FAST_TIMEOUT_SEC:60}
  media:
    dir: ""                     # 留空则用 {data-dir}/media（FR-51 媒体副本目录）
  # 异步任务（M8 第一片）：Java 起子进程跑 scripts/roughcut.py
  # 路径**相对启动目录**（与 data-dir 同约定）：源码模式=仓库根，发布包=包根
  roughcut:
    python: ${POLYFACE_ROUGHTCUT_PYTHON:python-service/.venv/Scripts/python.exe}
    script: ${POLYFACE_ROUGHTCUT_SCRIPT:scripts/roughcut.py}
    stall-sec: ${POLYFACE_ROUGHTCUT_STALL_SEC:300}   # 多久没新事件算疑似卡死
    keep-jobs: ${POLYFACE_ROUGHTCUT_KEEP_JOBS:50}    # 任务列表保留条数
  # 内嵌编辑器（M6-2）：受管的 gimpish serve 子进程，端口只监听 127.0.0.1
  editor:
    enabled: ${POLYFACE_EDITOR_ENABLED:true}   # 关掉则 /api/editor/open 直接 needs_manual，不起进程
    port: ${POLYFACE_EDITOR_PORT:8765}
  gimpish:
    # gimpish 入口；留空则依次看 POLYFACE_GIMPISH、PATH（docs/68 §7）。
    # 刻意不在 yml 里绑环境变量：定位优先级由 EditorProcess 一处实现，避免两处规则打架
    path: ""
  # Langfuse 可观测（FR-71）：默认关闭，密钥一律环境变量注入、不落仓库
  langfuse:
    enabled: ${LANGFUSE_ENABLED:false}
    host: ${LANGFUSE_HOST:http://localhost:3000}
    public-key: ${LANGFUSE_PUBLIC_KEY:}
    secret-key: ${LANGFUSE_SECRET_KEY:}

logging:
  level:
    com.polyface: INFO
