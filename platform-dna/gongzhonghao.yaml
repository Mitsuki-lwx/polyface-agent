# 微信公众号平台 DNA（M3 起使用）
# 自研整理：依据公开运营方法论，不逐字复制第三方文本。
platform: gzh
version: 0.1
video_native: false

content_forms:
  - 图文长文  # 主要输出
  - 视频号文案（延伸）

style:
  - "书面但不僵硬，有作者人格与观点"
  - "开头建立'这和我有关'的代入感"
  - "段落短、小标题化，适合手机读"
  - "金句可适度加粗强调"
  - "信息密度高，允许适当深度展开"

structure_template:
  - "标题：可设悬念/数字/借热点，正文首段必须兑现标题"
  - "导语：1-2 段交代背景+抛出核心观点"
  - "主体：小标题分层展开，观点+论据+例子"
  - "结尾：观点升华/金句 + 引导在看/关注"

title_rules:
  - "建议 16~30 字，能引起好奇或利益点"
  - "避免纯标题党：正文首段与标题强相关"
  - "可提供 1 个主标题 + 2 个备选（不同策略）"

tags:
  count_max: 3
  guidance: "公众号不重标签，重标题与首图；话题标签用于'搜一搜'场景"
  mock: ["深度内容", "行业观察"]

limits:
  body_chars_max: 4000
  banned_direction: ["标题党与正文无关", "医疗功效断言", "低质夸张标题"]

viral_logic:
  - "打开率靠标题与首图；转发率靠观点/情绪/实用"
  - "'看一看/搜一搜'带来长尾搜索流量"
  - "系列化内容提升关注转化"

hooks:
  - "痛点场景开头"
  - "借热点切入但落到自身观点"
  - "开头直接抛反共识结论"
