# 微信公众号平台 DNA v2（2026-09-12 重建，来源可溯）
# 合规：仅使用公开资料整理，未爬取平台数据（ADR-010）

platform: gongzhonghao
display_name: 微信公众号
version: 2.0
updated_at: 2026-09-12

# ============================================================ 来源清单
sources:
  - id: wx-title-spec
    type: official
    title: 微信公众平台运营规范 —— 煽动、夸大、误导类内容
    url: https://fuwu.weixin.qq.com/community/business/doc/00082c13b1cdd8b6163d6b3d25680d
    note: "平台要求标题『准确、清晰、能体现文章主旨』，不允许用标题噱头诱导点击或误导用户"
    checked_at: 2026-09-12
    covers: [title_rules, limits.banned_direction]

  - id: wx-induce-spec
    type: official
    title: 微信公众平台运营规范 —— 诱导行为（诱导分享 / 诱导关注 / 诱导点击 / 违规导流）
    url: https://fuwu.weixin.qq.com/community/business/doc/000a2aa6894988021a3d8b84356c0d
    checked_at: 2026-09-12
    covers: [limits.banned_direction]

  - id: wx-platform-norms
    type: official
    title: 微信公众平台运营规范（含刷粉/外挂/滥用原创与赞赏/浪费账号资源）
    note: "经百度百科收录的平台规范条目核对"
    checked_at: 2026-09-12
    covers: [limits.banned_direction]

  - id: wx-practice
    type: practice
    title: 通用公众号写作经验（非平台规定）
    checked_at: 2026-09-12
    covers: [structure_template, hooks, viral_logic]

# ============================================================ 硬规格
specs:
  title_chars_max: 64
  digest_chars_max: 120
  body_chars_max: 20000

# ============================================================ 分发机制
distribution:
  - "来源 wx-title-spec / wx-practice"
  - "平台明确治理「关键词堆砌霸屏」：标题或正文大量重复关键词以干预微信搜索结果，将被阶梯性禁搜甚至封号"
  - "公众号以订阅号列表 + 转发朋友圈 + 搜一搜为主要流量来源（经验性）"
# ============================================================ 内容形式
content_forms:
  - 图文长文（标题 + 摘要 + 正文 + 封面）
  - 短图文 / 图片消息

# ============================================================ 风格
style:
  - "书面语为主，但避免学术腔；公众号读者对「讲清楚一件事」的期待高于「情绪刺激」"
  - "段落短、逻辑递进清晰，善用小标题"
  - "避免过度营销话术与绝对化表述"

# ============================================================ 结构范式（经验性）
structure_template:
  # 依据 wx-practice：以下为经验性做法，非平台规定
  - "开头：直接点明主题与价值，不绕弯（平台禁止标题隐藏关键信息，正文亦应一致）"
  - "正文：分节论述，每节有小标题"
  - "论据：案例 / 数据 / 引用（引用须标注来源）"
  - "结尾：总结 + 引导理性互动（禁止诱导分享语）"

# ============================================================ 标题
title_rules:
  # 依据 wx-title-spec：核心要求：准确、清晰、能体现文章主旨；不得用噱头诱导点击或误导
  - "≤64 字（超长会折叠显示，建议控制在 20 字内以适配列表展示）"
  - "严禁故意隐藏关键信息或凭空捏造信息"
  - "严禁以命令式语气强迫阅读、假借官方名义、『看完即删』类话术"

# ============================================================ 标签
tags:
  count_max: 3
  guidance: "公众号无强标签体系；话题标签建议 ≤3，主要服务于「合集/话题」归类"

# ============================================================ 红线
limits:
  body_chars_max: 20000
  banned_direction:
    - "诱导分享：『不转不是中国人』『请好心人转发一下』『转发后一生平安』『转疯了』『必转』等（处罚：禁转发/删文/删粉/封号）"
    - "诱导关注：以奖励强制或诱导关注（测试/解密/抽签/影视资源/扫码点餐等）"
    - "诱导点击：仿冒官方消息提醒（红点、数字）"
    - "煽动夸大误导类标题：恐吓侮辱惊悚极端、命令式语气、无依据夸大严重程度或受影响面、反常识强调食物行为对健康影响、假借官方名义、故意隐藏关键信息或凭空捏造"
    - "关键词堆砌（SEO 霸屏）：标题/正文大量重复关键词干预搜索排序"
    - "违规导流：擦边标题 + 跳转无关小程序骗取广告收益"
    - "刷粉、外挂、批量注册等作弊行为"
    - "滥用原创声明 / 滥用赞赏（募捐、赌博抽奖、售卖商品）"
  ai_disclosure:
    required: false
    note: "微信运营规范未见针对 AI 辅助创作的明文标识要求；但虚假信息与误导内容仍受规范约束"

# ============================================================ 互动钩子（经验性）
hooks:
  # 依据 wx-practice：经验性做法；**严禁任何诱导分享/关注话术**（官方处罚明确）
  - "结尾提出开放性问题，引导留言讨论"
  - "设置「相关阅读」链接自有历史文章"

viral_logic:
  - "打开率高度依赖标题与封面（故官方严管标题党）"
  - "转发是二次曝光主要来源（故官方严管诱导分享）"
  - "搜一搜带来长尾流量（故官方严管关键词堆砌）"

# ============================================================ 核实状态
verify:
  verified:
    - title_rules
    - limits.banned_direction
  todo:
    - field: specs.title_chars_max
      note: "64 字为通行上限值，未在官方文档中直接确认"
    - field: specs.digest_chars_max
      note: "120 字为经验值"
    - field: tags.count_max
      note: "公众号无官方标签数上限概念，3 为经验建议"
