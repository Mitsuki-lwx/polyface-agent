# 小红书平台 DNA v2（2026-09-12 重建，来源可溯）
# 重建原则：官方规则可溯 / 数字经核实 / 经验性内容明确标注 / 不假装确定
# 合规：仅使用公开资料整理，未爬取平台数据（ADR-010）

platform: xhs
display_name: 小红书
version: 2.0
updated_at: 2026-09-12

# ============================================================ 来源清单
sources:
  - id: xhs-convention-2
    type: official
    title: 小红书社区公约 2.0（2026-01-19 上线）
    note: "三大板块「真诚分享/友好互动/有序经营」共 25 条倡导；明确提出反对制造对立、反对虚假人设、拒绝伪造数据、AI 辅助创作需主动标明"
    checked_at: 2026-09-12
    covers: [limits.banned_direction, limits.ai_disclosure]

  - id: xhs-norms
    type: official
    title: 小红书社区规范（平台官方规范，含六大章节）
    url_note: "经第三方转载核对（newrank 收录平台原文），未获官方直链"
    checked_at: 2026-09-12
    covers: [limits.banned_direction, title_rules, limits.titlebait]

  - id: xhs-diversion
    type: official
    title: 小红书交易导流违规管理细则（2025-03-12 生效）
    note: "禁止除小红书商城/直播间购物车/官方留资组件外的一切站外交易引导"
    checked_at: 2026-09-12
    covers: [limits.banned_direction]

  - id: xhs-practice
    type: practice
    title: 通用内容运营经验（非平台规定）
    note: "结构范式、互动钩子等属经验性做法，平台并未强制要求"
    checked_at: 2026-09-12
    covers: [structure_template, hooks, viral_logic]

# ============================================================ 硬规格
specs:
  title_chars_max: 20
  body_chars_max: 1000
  tags_max: 10
  images_max: 18
  video_sec_max: 300

# ============================================================ 分发机制
distribution:
  - "来源 xhs-norms / xhs-practice / xhs-convention-2"
  - "搜索分发权重高：标题与正文需埋真实搜索词（这也是标题 20 字内关键词前置的原因）"
  - "推荐流（发现页）为主入口；首图点击率对曝光影响大"
  - "平台已建立监测机制打击「非正常手段干预内容分发」——不得做关键词堆砌等作弊"
# ============================================================ 内容形式
content_forms:
  - 图文笔记（首图 + 正文 + 标签）
  - 视频笔记（口播稿 + 封面文案）

# ============================================================ 风格
style:
  - "真诚、第一人称、有亲身经历感（平台明确反对虚假人设与过度包装）"
  - "口语化但不失信息密度"
  - "适度 emoji 点缀，忌满屏表情"
  - "分段清晰，一行一意，留白多"
  - "避免夸张标题党（社区规范 4.1.3 将「标题党」明列为不友好内容）"

# ============================================================ 结构范式（经验性）
structure_template:
  # 依据 xhs-practice：以下为经验性做法，非平台规定
  - "开头：直接抛结论或痛点，1-2 行内说清解决什么"
  - "正文：分点/分步展开，每段小标题式开头"
  - "体验/证据：给出可验证细节（数据、前后对比、清单）"
  - "结尾：收藏引导 + 评论区互动提问"

# ============================================================ 标题
title_rules:
  # 依据 xhs-norms：不超过 20 字；关键词前置（搜索分发）
  - "多用「数字 + 结果」或「痛点 + 解决方案」"
  - "严禁题文不符、夸大：社区规范将「标题党、图文不符」列为不友好内容"

# ============================================================ 标签
tags:
  count_max: 6
  spec_max: 10
  guidance: "3~4 个垂直领域词 + 1~2 个热度/场景词；不堆砌低质标签"

# ============================================================ 红线
limits:
  body_chars_max: 1000
  banned_direction:
    - "站外导流：个人联系方式（手机号/微信号/邮箱/地址）、其他平台信息、站外链接/二维码/水印（社区规范 §3.2 + 交易导流细则）"
    - "标题党、图文不符、首图血腥恐怖（社区规范 §4.1.3）"
    - "制造对立：性别/地域/职业/兴趣群体贴标签、放大差异、煽动矛盾（社区公约 2.0 核心倡导）"
    - "虚假人设与伪造数据：财富/学历/收入/情感经历造假，伪造口碑，伪装素人，AIGC 造假"
    - "违背科学常识：食品安全/健康养生领域已被权威辟谣的内容（社区规范 §4.2.2）"
    - "商品与服务：医疗功效断言、绝对化用语、高风险类（医美/医疗器械等）"
    - "过度营销语句：过分参照商家指引、堆砌官方宣传话术（社区规范 §4.1.4）"
  ai_disclosure:
    required: true
    note: "使用 AI 辅助工具创作需主动标明（社区公约 2.0）——本工具产出的稿件发布时应标注 AI 辅助"

# ============================================================ 互动钩子（经验性）
hooks:
  # 依据 xhs-practice：经验性做法，非平台规定
  - "互动提问收尾：'你们会怎么选？评论区聊聊'"
  - "评论区运营：作者置顶补充信息"

viral_logic:
  - "收藏率权重高：内容要「可保存」（清单/攻略/教程）"
  - "搜索流量占比大：标题与正文需埋真实搜索词"
  - "封面点击率决定曝光：首图大字+高对比"

# ============================================================ 核实状态
verify:
  verified:
    - specs.title_chars_max
    - specs.body_chars_max
    - limits.banned_direction
    - limits.ai_disclosure
  todo:
    - field: tags.count_max
      note: "官方未明确单条笔记话题数上限；specs.tags_max=10 为行业通行值，当前 count_max=6 为经验建议值"
    - field: specs.video_sec_max
      note: "普通用户视频时长上限随账号等级变化，300s 为保守值，待官方确认"
    - field: images_max
      note: "18 张为常见上限，未在官方文档中直接确认"
