# 小红书平台 DNA（示例版，M2 起使用）
# 自研整理，依据公开运营方法论，不逐字复制第三方文本。
platform: xhs
version: 0.1

content_forms:
  - 图文笔记
  - 视频笔记(口播稿+封面文案)

style:
  - "真诚、第一人称、有亲身经历感"
  - "口语化但不失信息密度"
  - "适度 emoji 点缀，忌满屏表情"
  - "分段清晰，一行一意，留白多"
  - "避免夸张标题党（平台治理严），以'实用/共鸣'为导向"

structure_template:
  - "开头：直接抛结论或痛点，1-2 行内说清这篇解决什么"
  - "正文：分点/分步展开，每段小标题式开头"
  - "体验/证据：给出可验证细节（数据、前后对比、清单）"
  - "结尾：收藏引导 + 评论区互动提问"

title_rules:
  - "不超过 20 字"
  - "关键词前置（平台有搜索分发）"
  - "多用'数字+结果'或'痛点+解决方案'"

tags:
  count_max: 6
  guidance: "3~4 个垂直领域词 + 1~2 个热度/场景词，不用低质堆砌标签"

limits:
  body_chars_max: 1000
  banned_direction: ["医疗功效断言", "绝对化用语(最/第一)", "站外导流(微信号/外链)"]

viral_logic:
  - "收藏率权重高：内容要'可保存'（清单/攻略/教程）"
  - "搜索流量占比大：标题与正文埋搜索词"
  - "封面点击率决定曝光：首图大字+高对比"

hooks:
  - "互动提问收尾：'你们会怎么选？评论区聊聊'"
  - "评论区运营：作者置顶补充信息可提升互动"
