# 抖音平台 DNA v2（2026-09-12 重建，来源可溯）
# 合规：仅使用公开资料整理，未爬取平台数据（ADR-010）

platform: douyin
display_name: 抖音
version: 2.0
updated_at: 2026-09-12
# 视频原生平台：成稿后附剪辑单（FR-50）
video_native: true

# ============================================================ 来源清单
sources:
  - id: dy-convention
    type: official
    title: 抖音社区自律公约
    url: https://www.douyin.com/rule/policy
    checked_at: 2026-09-12
    covers: [limits.banned_direction, style, distribution]

  - id: dy-creator-spec
    type: official
    title: 短视频创作者管理规范（含内容安全 / 营销诱导 / 低质判定）
    url: https://developer.open-douyin.com/docs/resource/zh-CN/mini-app/operation/platform-capabilities/video/video-creator-promote-mount-mgmt-spec
    checked_at: 2026-09-12
    covers: [limits.banned_direction, title_rules, limits.titlebait, limits.low_quality]

  - id: dy-practice
    type: practice
    title: 通用短视频运营经验（非平台规定）
    checked_at: 2026-09-12
    covers: [structure_template, hooks, viral_logic, clip_fields]

# ============================================================ 硬规格
specs:
  title_chars_max: 55
  caption_chars_max: 2200
  video_sec_max: 900
  hashtag_suggest_max: 5

# ============================================================ 分发机制
distribution:
  - "来源 dy-convention / dy-creator-spec / dy-practice"
  - "平台明确治理「批量发布同质化、低质量、无意义内容」——重复画风会被判定为不利生态"
  - "原创度低（搬运/简单拼凑/仅换封面-BGM-顺序）会被限制推荐"
  - "完播率与互动是核心指标（经验性，平台未公开完整权重）"
# ============================================================ 内容形式
content_forms:
  - 短视频（口播稿 + 字幕 + 分镜）
  - 图文（多图 + 文案）

# ============================================================ 风格
style:
  # 依据 dy-convention：平台倡导真实表达、真人出镜或讲解
  - "真实表达、真人出镜或讲解，避免虚假做作与伪纪实行为"
  - "前三秒必须给到信息增量或冲突点（口播稿写法）"
  - "口语化强、句子短、适合配音朗读"
  - "忌书面长句与生僻词（社区倡导重视文字正确使用）"

# ============================================================ 结构范式（经验性）
structure_template:
  # 经验性做法（dy-practice），非平台规定
  - "0-3s 钩子：直接给结论/反常识/痛点"
  - "3-15s 展开：给出依据或经历"
  - "15-40s 干货：分点讲清做法"
  - "结尾：引导互动（禁止诱导式诱导，见 limits）"

# ============================================================ 标题
title_rules:
  # 依据 dy-creator-spec：标题与画面/内容必须一致
  - "标题不得与画面/口播内容相悖或不符"
  - "不得出现站外购买途径或引导站外购买话术"
  - "不得出现手机号/微信/QQ 群等联系方式"

# ============================================================ 标签
tags:
  count_max: 5
  guidance: "1~2 个核心话题 + 2~3 个场景词；话题需与内容真实相关"

# ============================================================ 红线
limits:
  video_sec_max: 900
  banned_direction:
    - "绝对化用语：「最全」「最佳」「第一」等（创作者规范 §3.1，依据广告法）"
    - "诱导互动：非理性表态/卖惨/道德绑架式诱导点赞评论关注；『故意不讲重点、内容不完整诱骗观看』（§3.4）"
    - "引流站外交易：站外购买途径、联系方式（§3.3）"
    - "虚假夸张：不切实际的功能/质量/排名描述；用特效展示实际无法实现的效果（§3.1）"
    - "贬低拉踩：贬损/恶意对比其他品牌（§2.3）"
    - "低质内容：单图+大量文字、模板感强的图片轮播、无明确主题随拍（§4.2）"
    - "重复画风：同账号重复发布高度相似内容，仅改封面/文字/背景/BGM（§5）"
    - "搬运与简单拼凑：他人素材简单二次加工、仅翻译配音（§4.1）"
    - "医疗内容：非认证用户不得发布疾病预防/诊断/治疗/用药内容；泛健康类禁止宣称医疗功效（医疗公约）"
    - "不当价值导向：炫富拜金、畸形婚恋观、地域/群体歧视、卖惨蹭热度（社区公约）"
  ai_disclosure:
    required: false
    note: "抖音社区公约未像小红书那样明文要求标注 AI 辅助；但「避免虚假人设/伪纪实」的倡导同样约束 AI 伪造内容"

# ============================================================ 剪辑单字段（供 FR-50 用）
clip_fields:
  - "分镜序号 / 时间轴 / 画面建议 / 口播文案 / 字幕断句 / BGM与转场提示"

# ============================================================ 互动钩子（经验性）
hooks:
  # 经验性做法（dy-practice）；官方禁止「诱导互动」，钩子须给真实价值而非道德绑架
  - "结尾提问引导评论"
  - "评论区补充信息"

viral_logic:
  - "完播率与互动是核心指标（经验性，平台未公开权重）"
  - "前三秒决定留存：钩子必须给真实价值而非诱导"
  - "原创度影响推荐：搬运与简单拼凑会被限流（官方明文）"

# ============================================================ 核实状态
verify:
  verified:
    - limits.banned_direction
    - title_rules
    - structure_template
  todo:
    - field: specs.title_chars_max
      note: "55 字为行业通行值，未在官方文档中直接确认"
    - field: specs.caption_chars_max
      note: "2200 字为经验值，待官方确认"
    - field: specs.video_sec_max
      note: "普通用户通常 15 分钟，认证/粉丝量高者更长；900s 为保守值"
