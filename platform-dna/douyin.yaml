# 抖音平台 DNA（M3 起使用）
# 自研整理：依据公开运营方法论，不逐字复制第三方文本。
platform: douyin
version: 0.1
video_native: true   # 视频平台：draft 后生成剪辑单(clip_sheet)

content_forms:
  - 短视频(口播稿+分镜)  # 主要输出：竖屏口播脚本
  - 图文  # 次要形态

style:
  - "口语化、节奏快、像跟朋友唠嗑"
  - "开头三秒必须立钩子：冲突/悬念/反常识/直接给结果"
  - "句子短，多用第二人称'你'"
  - "可带一点夸张与情绪，但事实不许编"
  - "字幕友好：断句清晰，方便逐句显示"

structure_template:
  - "前3秒钩子：一句话说清最扎心的点或结果"
  - "5-15秒展开：交代背景/痛点，拉共鸣"
  - "主体：2-4 个短要点，每个点一句话到两句话"
  - "结尾：行动召唤(关注/评论/转发)或悬念留钩"

title_rules:
  - "前3秒口播即'标题'，不用书面标题"
  - "文案首行作为置顶评论钩子：数字/争议/反问"
  - "文案区需保留悬念词，防止折叠后无爆点"

tags:
  count_max: 5
  guidance: "蹭热点话题 + 2~3垂类词；不用与内容无关的流量词"
  mock: ["抖音干货", "口播", "经验分享"]

limits:
  body_chars_max: 700
  banned_direction: ["绝对化用语(最/第一/100%)", "医疗功效断言", "站外导流"]

viral_logic:
  - "完播率优先：时长越短越好，信息密度高"
  - "评论互动加权：结尾留争议点或提问"
  - "热点 BGM/话题可叠加流量，但内容须相关"

hooks:
  - "冲突开场：'大多数人做X都错了'"
  - "结果前置：'我靠这个方法3个月…'"
  - "反常识：'越努力越穷，是因为…'"
