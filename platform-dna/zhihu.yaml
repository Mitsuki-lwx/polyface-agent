# 知乎平台 DNA v2（2026-09-12 重建，来源可溯）
# 合规：仅使用公开资料整理，未爬取平台数据（ADR-010）

platform: zhihu
display_name: 知乎
version: 2.0
updated_at: 2026-09-12

# ============================================================ 来源清单
sources:
  - id: zh-agreement
    type: official
    title: 知乎协议（2025-03-20 更新 / 2025-03-25 生效）§二 使用规则
    url: https://www.zhihu.com/terms
    note: "明文限制「使用夸张标题，内容与标题严重不符」；并要求 AI 生成内容须显著标识"
    checked_at: 2026-09-12
    covers: [title_rules, limits.banned_direction, limits.ai_disclosure]

  - id: zh-norms-ref
    type: official
    title: 《知乎社区规范》与「社区规则中心」（协议 §二.07 指向的正式规范）
    url_note: "zhuanlan.zhihu.com/p/506696688（协议中引用，未逐条抓取）"
    checked_at: 2026-09-12
    covers: [limits.banned_direction]

  - id: zh-weights
    type: industry-report
    title: 知乎内容分发与权重机制（第三方 MCN 公开解读）
    note: "非官方文档；点赞权重最高、大V加权、新内容冷启动加权等为行业公认经验"
    checked_at: 2026-09-12
    covers: [distribution, viral_logic]

  - id: zh-practice
    type: practice
    title: 通用知乎写作经验（非平台规定）
    checked_at: 2026-09-12
    covers: [structure_template, hooks]

# ============================================================ 硬规格
specs:
  title_chars_max: 100
  body_chars_min_suggest: 100
  body_chars_max: 0
  note: "知乎回答无上限；但过短（<100 字）易被判定质量不足而折叠"

# ============================================================ 分发机制
distribution:
  - "来源 zh-weights（第三方解读）/ zh-agreement"
  - "自然流量主要来自「平台推荐」与「问题关注」；转发扩散贡献长尾"
  - "排序动态变化：正向互动中点赞权重最高；负面互动中「不喜欢」降权最大"
  - "新内容有冷启动加权（前排展示机会），单位时间获赞高者留在前排"
  - "账号维度：大V/重点推荐账号加权；领域内高质量回答提升该领域投票权重；匿名不计权重"
# ============================================================ 内容形式
content_forms:
  - 回答（针对具体问题）
  - 文章（自发主题）
  - 想法（短内容）

# ============================================================ 风格
style:
  - "理性、有依据、可验证；知乎的核心价值主张是「创造有价值的内容」"
  - "第一人称经验 + 明确边界（自身经历 vs 普遍结论）"
  - "避免模糊表达（『我觉得』『大概』），用事实与逻辑支撑"
  - "保持友善中立，不做绝对化断言"

# ============================================================ 结构范式（经验性）
structure_template:
  # 依据 zh-practice：以下为经验性做法，非平台规定
  - "开头：直接回应问题的核心（知乎严禁答非所问）"
  - "正文：分论点 + 论据；可用小标题、列表"
  - "可验证细节：数据、来源、亲历过程"
  - "结尾：结论 + 适用边界说明"

# ============================================================ 标题
title_rules:
  # 依据 zh-agreement：严禁「使用夸张标题，内容与标题严重不符」（协议 §二.05 明文）
  - "回答以问题本身为标题，正文需紧扣问题"
  - "文章标题应准确概括内容，不做标题党"

# ============================================================ 标签
tags:
  count_max: 5
  guidance: "话题需与内容强相关；错误话题会影响分发与账号领域权重"

# ============================================================ 红线
limits:
  banned_direction:
    - "标题党：夸张标题 + 内容与标题严重不符（协议 §二.05）"
    - "答非所问：回答与问题不相关或关联度低（知乎特有）"
    - "一稿多投：同一内容原封不动投向多个问题（知乎特有）"
    - "不实信息：阐述不正确或未经证实，严重违背常理与客观规律"
    - "绝对化用语：『最』『第一』『顶级』等极限词，除非有明确权威证明（如引用 IDC 数据）"
    - "垃圾广告与诱导信息：推广链接、返利链接、图片广告、抽奖链接"
    - "不友善行为：人身攻击、谩骂、阴阳怪气、恐吓威胁、歧视性言论"
    - "不规范转载：未标出处/原作者/原文链接"
    - "炒作绯闻丑闻、不当评述灾难、性暗示、血腥惊悚、煽动歧视（协议 §二.05）"
    - "医疗健康等专业领域：无资质内容的谨慎处理，建议加免责声明"
  ai_disclosure:
    required: true
    note: "协议 §二.06：利用生成式 AI 制作的非真实信息或可能导致公众混淆的内容，**应以显著方式予以标识**，否则平台可增加标识、限制或封禁"

# ============================================================ 互动钩子（经验性）
hooks:
  # 依据 zh-practice：经验性做法；知乎更重「有价值」而非「引导互动」
  - "结尾邀请补充不同经验（保持友善）"
  - "评论区回应质疑以提升可信度"

viral_logic:
  - "点赞权重最高，负面互动中「不喜欢」降权最大（第三方解读）"
  - "新内容有冷启动加权，单位时间获赞高者留在前排"
  - "领域垂直度提升该领域投票权重；匿名不计权重"

# ============================================================ 核实状态
verify:
  verified:
    - limits.banned_direction
    - limits.ai_disclosure
    - title_rules
  todo:
    - field: distribution（权重细节）
      note: "点赞权重/大V加权/冷启动加权来自第三方解读，非官方公开文档；标注为 industry-report"
    - field: specs.title_chars_max
      note: "100 字为经验上限，官方未明确"
    - field: 好物推荐限制（≥200字/商品卡≤25字/每日≤10篇）
      note: "来自第三方解读，未获官方原文，故未写入 specs"
