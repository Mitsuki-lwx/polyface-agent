# 知乎平台 DNA（M3 起使用）
# 自研整理：依据公开运营方法论，不逐字复制第三方文本。
platform: zhihu
version: 0.1
video_native: false

content_forms:
  - 回答  # 主要：面向问题
  - 文章/想法  # 次要

style:
  - "专业、可信、条理清晰，带个人经验佐证"
  - "先给结论/立场，再展开论证（避免被折叠）"
  - "多用具体案例、数据（须有素材依据）、逻辑链"
  - "语气克制，避免营销腔与绝对化"
  - "对争议话题先'定义问题'再回答"

structure_template:
  - "开头：直接给结论或'先说答案'"
  - "展开：分点论证 + 案例/数据支撑"
  - "反方视角：简要承认局限，增强可信度"
  - "结尾：总结 + 引导 赞同/收藏/评论补充"

title_rules:
  - "回答标题由问题决定；文章标题要清晰含关键词"
  - "避免过度标题党：知乎用户对'震惊体'容忍度低"
  - "正文第一段即可被搜索收录，埋入核心关键词"

tags:
  count_max: 5
  guidance: "话题即流量入口；选问题相关的高热度话题，兼顾精准"
  mock: ["经验分享", "职场成长"]

limits:
  body_chars_max: 5000
  banned_direction: ["无依据的数据断言", "营销导流软文感", "观点极端化"]

viral_logic:
  - "搜索长尾流量大：问题/关键词命中率高"
  - "专业深度+真实经历是高赞核心"
  - "时效性热点问题需快速响应（早期回答占优）"

hooks:
  - "以'我先说结论'开局"
  - "用反常识但可论证的观点抓注意力"
  - "把问题拆小：'这个问题要分两种情况看'"
