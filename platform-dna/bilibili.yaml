# B站平台 DNA v2（2026-09-12 重建，来源可溯）
# 合规：仅使用公开资料整理，未爬取平台数据（ADR-010）

platform: bilibili
display_name: 哔哩哔哩
version: 2.0
updated_at: 2026-09-12
# 视频原生平台：成稿后附剪辑单（FR-50）
video_native: true

# ============================================================ 来源清单
sources:
  - id: bl-convention
    type: official
    title: bilibili 社区公约
    url: https://member.bilibili.com/studio/convention/content?index=2-1
    note: "含违法违禁、个人信息、地图规范等；要求特地区域表述规范化（如「新疆维吾尔自治区」「侵华日军南京大屠杀遇难同胞纪念馆」）"
    checked_at: 2026-09-12
    covers: [limits.banned_direction, limits.map_compliance]

  - id: bl-order
    type: official
    title: bilibili 社区公约 —— 扰乱平台秩序（垃圾信息 / 垃圾投稿 / 恶意投稿）
    url: https://member.bilibili.com/studio/convention/content?index=2-9
    note: "禁止添加与内容无关的标签；禁止大批量低质投稿与异常占稿"
    checked_at: 2026-09-12
    covers: [tags, limits.banned_direction, limits.low_quality]

  - id: bl-title-spec
    type: official
    title: BILIBILI 不接受的投稿内容 —— 不适宜的标题形式 / 不允许的垃圾广告
    url: https://www.bilibili.com/read/cv8057302
    note: "明文列举 5 类标题党：过度夸张惊叹词、断章取义、**故意营造悬念**、捏造正文不存在的人事物、题文不符有歧义"
    checked_at: 2026-09-12
    covers: [title_rules, limits.titlebait, limits.banned_direction]

  - id: bl-game-policy
    type: official
    title: 关于游戏区恶性引战、人身攻击行为的专项治理公告
    url: https://www.bilibili.com/opus/988812144296329236
    note: "典型案例显示：封面/标题与视频内容无关联会被限流"
    checked_at: 2026-09-12
    covers: [limits.banned_direction, limits.titlebait]

  - id: bl-practice
    type: practice
    title: 通用B站运营经验（非平台规定）
    checked_at: 2026-09-12
    covers: [structure_template, hooks, viral_logic, clip_fields]

# ============================================================ 硬规格
specs:
  title_chars_max: 80
  desc_chars_max: 2000
  tags_suggest_max: 10
  video_sec_max: 0
  note: "视频时长无统一上限（按等级/类型而定）"

# ============================================================ 分发机制
distribution:
  - "来源 bl-title-spec / bl-order / bl-practice"
  - "平台按「标题 + 封面 + 内容一致性」判定是否限流；三要素不符是常见限流原因"
  - "禁止大批量投稿与机器快速发布——平台会判定为垃圾投稿"
  - "推荐流 + 搜索 + 关注动态为主要入口；完播与互动影响推荐（经验性）"
# ============================================================ 内容形式
content_forms:
  - 视频（口播稿 + 分镜 + 封面标题）
  - 专栏文章
  - 动态

# ============================================================ 风格
style:
  - "信息密度高、有观点、有依据；B站用户对「言之有物」的容忍度低"
  - "口语化但可以更长，允许较完整的论述"
  - "避免粗俗用语与侮辱性表述（专项治理重点）"

# ============================================================ 结构范式（经验性）
structure_template:
  # 依据 bl-practice：以下为经验性做法，非平台规定
  - "开头：明确本期讲什么、为什么值得看（不得虚假悬念）"
  - "主体：分点/分章节展开，逻辑递进"
  - "论据：数据、案例、演示"
  - "结尾：总结 + 下期预告（如有）"

# ============================================================ 标题
title_rules:
  # 依据 bl-title-spec：平台明列 5 类不适宜标题：(1) 过度夸张的惊叹词 (2) 断章取义歪曲事实 (3) **故意营造悬念引人好奇** (4) 捏造正文中不存在的人/物/情节 (5) 题文不符、标题有歧义
  - "标题必须与内容真实对应（游戏区案例中题文不符被限流）"
  - "封面与标题、内容三者需一致"

# ============================================================ 标签
tags:
  count_max: 10
  guidance: "标签必须与内容相关——官方明文禁止添加与视频内容完全无关的标签"
  spec_note: "分区选择需正确，错区会被视为恶意投稿"

# ============================================================ 红线
limits:
  banned_direction:
    - "标题党：过度夸张惊叹词 / 断章取义 / **故意营造悬念** / 捏造内容 / 题文不符（官方 5 类）"
    - "封面、标题与内容无关联（专项治理案例：限流）"
    - "垃圾广告：商业推广、邀请码链接、纯招聘、金融理财广告（股票基金/虚拟货币/保险/培训课程）"
    - "标签与内容无关（官方明文）"
    - "垃圾投稿：大批量投稿、机器快速发布、贩卖数据"
    - "恶意投稿：规避重复投稿规则、异常占稿、反复上传违规内容"
    - "引战与人身攻击：侮辱性言论、以偏概全贴标签、反串造谣激化矛盾"
    - "违法违禁：危害国家制度、分裂国家、违规使用特定标识与称谓"
  map_compliance:
    required: true
    note: "严格遵照中国版图使用规范：地图残缺、地名不完整、地名篡改均属违规；涉地理内容需特别谨慎"
  ai_disclosure:
    required: false
    note: "社区公约为未明文要求 AI 标识；但虚假内容与低质生成内容受「垃圾投稿」条款约束"

# ============================================================ 剪辑单字段（供 FR-50 用）
clip_fields:
  - "分镜序号 / 时间轴 / 画面建议 / 口播文案 / 字幕断句 / BGM与转场提示"

# ============================================================ 互动钩子（经验性）
hooks:
  # 依据 bl-practice：经验性做法；注意禁止引战式互动
  - "结尾提出可讨论的观点，引导理性讨论"
  - "置顶评论补充信息"

viral_logic:
  - "标题/封面/内容三要素一致性决定是否被限流（官方专项治理）"
  - "完播与互动影响推荐（经验性）"
  - "收藏与投币是强正向信号（经验性）"

# ============================================================ 核实状态
verify:
  verified:
    - title_rules
    - tags
    - limits.banned_direction
    - limits.map_compliance
  todo:
    - field: specs.title_chars_max
      note: "80 字为经验值，官方未明确上限"
    - field: specs.desc_chars_max
      note: "2000 字为经验值"
    - field: specs.video_sec_max
      note: "视频时长上限随账号等级/类型变化，未设统一值"
