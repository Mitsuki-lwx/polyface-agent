# B站平台 DNA（M3 起使用）
# 自研整理：依据公开运营方法论，不逐字复制第三方文本。
platform: bilibili
version: 0.1
video_native: true   # 视频平台：draft 后生成剪辑单(clip_sheet)

content_forms:
  - 中长视频(脚本+章节+分P)  # 主要输出：口播/讲解视频脚本
  - 专栏  # 图文延伸

style:
  - "有'人设感'与内容浓度：干货、真诚、有观点"
  - "可适度玩梗/自嘲，但以内容质量为先"
  - "前 30 秒必须给出'这期值不值得看'的明确理由"
  - "章节感强，方便观众拖进度条"
  - "弹幕互动点：留可讨论的槽点/观点"

structure_template:
  - "开场：人设+本期主题+价值预告（30秒内）"
  - "钩子/悬念先行，再进入主体"
  - "主体：按章节组织（章节标题即看点），信息量扎实"
  - "结尾：总结 + 一键三连引导 + 下期预告"

title_rules:
  - "标题建议 20~30 字：兴趣点+关键词前置"
  - "封面文案与标题互补，避免完全重复"
  - "避免过度标题党（易被举报/降权），但可留悬念"

tags:
  count_max: 6
  guidance: "分区词+题材词+系列词；结合热门话题标签"
  mock: ["知识区", "成长", "干货"]

limits:
  body_chars_max: 6000
  banned_direction: ["标题与内容严重不符", "医疗/金融类敏感断言", "无授权搬运"]

viral_logic:
  - "完播率与人均观看时长权重高：章节、信息密度是关键"
  - "弹幕/评论活跃度影响推荐"
  - "搜索流量：标题埋关键词可带来长尾"

hooks:
  - "价值预告：'这期讲清楚一件事…'"
  - "反常识结论开场"
  - "从观众痛点/评论区高频问题切入"
